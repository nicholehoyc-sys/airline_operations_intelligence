[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airline-operations-intelligence"
version = "0.2.0"
description = "BTS domestic flight benchmarking with CCR DEA and descriptive aircraft activity"
requires-python = ">=3.10"
dependencies = ["pandas>=2.1,<3", "numpy>=1.24,<3", "scipy>=1.11,<2", "requests>=2.31,<3"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.37,<2", "plotly>=5.17,<7"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["airline_dea*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
